version: '3.8'

# ============================================================
#  Antioquía (Sede Nube - AWS2) — Mercader Apache
#  Servidor web PHP + Apache en contenedor Docker
#  Puerto (Subred Pública 10.1.0.64/26)
# ============================================================

services:
  web:
    build: .                          # Usa el Dockerfile local (imagen personalizada)
    ports:
      - "80:80"                       # Puerto público HTTP
    volumes:
      - ./html:/var/www/html/         # Ficheros web montados desde el host
    restart: always                   # Se levanta solo si la instancia se reinicia
