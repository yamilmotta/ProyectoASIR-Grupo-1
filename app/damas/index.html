<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Damas — Rojas vs Negras</title>
  <style>
    /* ── Reset + variables ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --c-claro:  #f0d9b5;
      --c-oscuro: #b58863;
      --c-sel:    #7fc97f;
      --c-mov:    #5b9bd5;
      --c-cap:    #e25c5c;
      --c-roja:   #cc3333;
      --c-negra:  #1a1a1a;
      --c-dama:   #ffd700;
      --sombra:   0 4px 20px rgba(0,0,0,.35);
      --trans:    .25s cubic-bezier(.4,0,.2,1);
    }

    body {
      font-family: system-ui, sans-serif;
      background: #2c2c2c;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
      gap: 1.5rem;
    }

    h1 { font-size: 1.6rem; letter-spacing: .5px; color: #f0d9b5; }

    /* ── Panel de estado ── */
    #panel {
      display: flex;
      gap: 1.5rem;
      align-items: center;
      background: rgba(255,255,255,.07);
      padding: .75rem 1.5rem;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      flex-wrap: wrap;
      justify-content: center;
    }

    .turno-badge {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-size: .9rem;
      font-weight: 500;
    }

    .turno-circulo {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #f0d9b5;
      transition: background var(--trans);
    }

    .turno-circulo.R { background: var(--c-roja); }
    .turno-circulo.N { background: var(--c-negra); }

    #btn-nueva {
      background: #b58863;
      color: #fff;
      border: none;
      padding: .45rem 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: .85rem;
      font-weight: 500;
      transition: background var(--trans), transform .1s;
    }
    #btn-nueva:hover { background: #9a7248; }
    #btn-nueva:active { transform: scale(.97); }

    #msg-estado { font-size: .85rem; color: #aaa; }

    /* ── Tablero ── */
    #tablero-wrap {
      position: relative;
    }

    #tablero {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: min(72vw, 560px);
      height: min(72vw, 560px);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: var(--sombra);
      border: 3px solid #7a5c3b;
    }

    .casilla {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: filter var(--trans);
    }

    .casilla.claro  { background: var(--c-claro); }
    .casilla.oscuro { background: var(--c-oscuro); }

    .casilla.seleccionada { filter: brightness(1.3); outline: 3px solid var(--c-sel) inset; }
    .casilla.movimiento::after {
      content: '';
      position: absolute;
      width: 30%;
      height: 30%;
      border-radius: 50%;
      background: var(--c-mov);
      opacity: .75;
      pointer-events: none;
    }
    .casilla.captura::after {
      content: '';
      position: absolute;
      width: 30%;
      height: 30%;
      border-radius: 50%;
      background: var(--c-cap);
      opacity: .85;
      pointer-events: none;
    }

    /* ── Pieza ── */
    .pieza {
      width: 78%;
      height: 78%;
      border-radius: 50%;
      position: relative;
      transition:
        transform var(--trans),
        box-shadow var(--trans);
      cursor: pointer;
    }

    .pieza:hover { transform: scale(1.08); }

    .pieza.R  { background: radial-gradient(circle at 35% 35%, #e05555, var(--c-roja)); box-shadow: 0 3px 8px rgba(0,0,0,.5), inset 0 1px 2px rgba(255,255,255,.25); }
    .pieza.N  { background: radial-gradient(circle at 35% 35%, #444, var(--c-negra)); box-shadow: 0 3px 8px rgba(0,0,0,.5), inset 0 1px 2px rgba(255,255,255,.15); }
    .pieza.RD { background: radial-gradient(circle at 35% 35%, #e05555, var(--c-roja)); box-shadow: 0 3px 8px rgba(0,0,0,.5), inset 0 1px 2px rgba(255,255,255,.25); }
    .pieza.ND { background: radial-gradient(circle at 35% 35%, #444, var(--c-negra)); box-shadow: 0 3px 8px rgba(0,0,0,.5), inset 0 1px 2px rgba(255,255,255,.15); }

    /* Corona para damas */
    .pieza.RD::after,
    .pieza.ND::after {
      content: '♛';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -48%);
      font-size: 1.4em;
      color: var(--c-dama);
      text-shadow: 0 1px 2px rgba(0,0,0,.8);
    }

    /* ── Animación de entrada de pieza ── */
    @keyframes pieza-entra {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    .pieza.nueva { animation: pieza-entra .3s cubic-bezier(.175,.885,.32,1.275); }

    /* ── Banner ganador ── */
    #ganador-banner {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.78);
      border-radius: 4px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1rem;
      z-index: 10;
    }
    #ganador-banner.visible { display: flex; }
    #ganador-banner h2 { font-size: 2rem; color: var(--c-dama); }

    /* ── Leyenda ── */
    #leyenda {
      display: flex;
      gap: 1.5rem;
      font-size: .78rem;
      color: #888;
      flex-wrap: wrap;
      justify-content: center;
    }
    .leyenda-item { display: flex; align-items: center; gap: .4rem; }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.verde  { background: var(--c-sel); }
    .dot.azul   { background: var(--c-mov); }
    .dot.rojo   { background: var(--c-cap); }
  </style>
</head>
<body>

  <h1>♟ Damas <span style="color:#aaa;font-weight:300">Rojas vs Negras</span></h1>

  <div id="panel">
    <div class="turno-badge">
      <div class="turno-circulo" id="turno-circulo"></div>
      <span id="turno-txt">Cargando...</span>
    </div>
    <span id="msg-estado"></span>
    <button id="btn-nueva">Nueva partida</button>
  </div>

  <div id="tablero-wrap">
    <div id="tablero"></div>
    <div id="ganador-banner">
      <h2 id="ganador-txt"></h2>
      <button id="btn-nueva2">Jugar de nuevo</button>
    </div>
  </div>

  <div id="leyenda">
    <div class="leyenda-item"><div class="dot verde"></div> Pieza seleccionada</div>
    <div class="leyenda-item"><div class="dot azul"></div> Movimiento libre</div>
    <div class="leyenda-item"><div class="dot rojo"></div> Captura</div>
  </div>

  <script type="module">
    /* ════════════════════════════════════════════════════════
       state.js — Estado de la aplicación (embebido)
       ════════════════════════════════════════════════════════ */
    const state = {
      partidaId:    null,
      tablero:      null,
      turno:        null,
      ganador:      null,
      movimientos:  {},     // { "fila,col": [{fila,col,captura},...] }
      seleccionada: null,   // { fila, col }
      ultimoTs:     0,
      pollingTimer: null,
      capturaOblg:  false,
    };

    /* ════════════════════════════════════════════════════════
       api.js — Comunicación con el backend (embebido)
       ════════════════════════════════════════════════════════ */
    const API = 'api.php';

    async function apiNuevaPartida() {
      const r = await fetch(`${API}?accion=nueva`, { method: 'POST' });
      return r.json();
    }

    async function apiEstado(id, ts = 0) {
      const r = await fetch(`${API}?accion=estado&id=${id}&ts=${ts}`);
      if (r.status === 304) return null; // Sin cambios
      return r.json();
    }

    async function apiMover(id, orFila, orCol, dsFila, dsCol) {
      const r = await fetch(`${API}?accion=mover`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ id, orFila, orCol, dsFila, dsCol }),
      });
      return r.json();
    }

    /* ════════════════════════════════════════════════════════
       board.js — Renderizado del tablero (embebido)
       ════════════════════════════════════════════════════════ */
    const elTablero = document.getElementById('tablero');

    function renderBoard(tablero, movimientos, seleccionada) {
      elTablero.innerHTML = '';
      const movSet   = new Set();
      const capSet   = new Set();

      if (seleccionada && movimientos[`${seleccionada.fila},${seleccionada.col}`]) {
        for (const m of movimientos[`${seleccionada.fila},${seleccionada.col}`]) {
          if (m.captura) capSet.add(`${m.fila},${m.col}`);
          else           movSet.add(`${m.fila},${m.col}`);
        }
      }

      for (let f = 0; f < 8; f++) {
        for (let c = 0; c < 8; c++) {
          const casilla = document.createElement('div');
          const esClaro = (f + c) % 2 === 0;
          casilla.className = 'casilla ' + (esClaro ? 'claro' : 'oscuro');
          casilla.dataset.f = f;
          casilla.dataset.c = c;

          const key = `${f},${c}`;
          if (seleccionada?.fila === f && seleccionada?.col === c) {
            casilla.classList.add('seleccionada');
          } else if (capSet.has(key)) {
            casilla.classList.add('captura');
          } else if (movSet.has(key)) {
            casilla.classList.add('movimiento');
          }

          const pieza = tablero[f][c];
          if (pieza) {
            const el = document.createElement('div');
            el.className = `pieza ${pieza} nueva`;
            casilla.appendChild(el);
            setTimeout(() => el.classList.remove('nueva'), 300);
          }

          casilla.addEventListener('click', () => handleClick(f, c));
          elTablero.appendChild(casilla);
        }
      }
    }

    /* ════════════════════════════════════════════════════════
       Lógica de clicks
       ════════════════════════════════════════════════════════ */
    async function handleClick(fila, col) {
      if (!state.partidaId || state.ganador) return;

      const pieza = state.tablero[fila][col];
      const key   = `${fila},${col}`;

      // Si hay pieza seleccionada y se hace click en un destino válido
      if (state.seleccionada) {
        const movs = state.movimientos[`${state.seleccionada.fila},${state.seleccionada.col}`] ?? [];
        const destino = movs.find(m => m.fila === fila && m.col === col);

        if (destino) {
          await hacerMovimiento(
            state.seleccionada.fila,
            state.seleccionada.col,
            fila, col
          );
          return;
        }
        // Click en otra pieza propia → cambiar selección
        if (state.movimientos[key]) {
          state.seleccionada = { fila, col };
          renderBoard(state.tablero, state.movimientos, state.seleccionada);
          return;
        }
        // Click en vacío → deseleccionar
        state.seleccionada = null;
        renderBoard(state.tablero, state.movimientos, null);
        return;
      }

      // Seleccionar pieza si tiene movimientos disponibles
      if (state.movimientos[key]) {
        state.seleccionada = { fila, col };
        renderBoard(state.tablero, state.movimientos, state.seleccionada);
      }
    }

    async function hacerMovimiento(orF, orC, dsF, dsC) {
      mostrarMensaje('Enviando movimiento...');
      const res = await apiMover(state.partidaId, orF, orC, dsF, dsC);
      if (!res.ok) {
        mostrarMensaje('❌ ' + res.error, true);
        return;
      }
      state.seleccionada = null;
      await sincronizarEstado(true); // Forzar recarga completa
    }

    /* ════════════════════════════════════════════════════════
       Sincronización + Polling diferencial
       ════════════════════════════════════════════════════════ */
    async function sincronizarEstado(forzar = false) {
      const ts   = forzar ? 0 : state.ultimoTs;
      const data = await apiEstado(state.partidaId, ts);

      if (data === null) return; // 304 - sin cambios

      if (!data.ok) { mostrarMensaje('Error: ' + data.error, true); return; }

      state.tablero    = data.tablero;
      state.turno      = data.turno;
      state.ganador    = data.ganador;
      state.ultimoTs   = data.ts;
      state.movimientos = data.movimientos ?? {};
      state.capturaOblg = data.capturaOblg;

      actualizarPanel();
      renderBoard(state.tablero, state.movimientos, state.seleccionada);

      if (state.ganador) {
        mostrarGanador(state.ganador);
        detenerPolling();
      }
    }

    function iniciarPolling() {
      detenerPolling();
      state.pollingTimer = setInterval(() => {
        if (!state.ganador) sincronizarEstado(false);
      }, 2000);
    }

    function detenerPolling() {
      if (state.pollingTimer) {
        clearInterval(state.pollingTimer);
        state.pollingTimer = null;
      }
    }

    /* ════════════════════════════════════════════════════════
       UI helpers
       ════════════════════════════════════════════════════════ */
    function actualizarPanel() {
      const circ = document.getElementById('turno-circulo');
      const txt  = document.getElementById('turno-txt');
      circ.className = 'turno-circulo ' + state.turno;
      txt.textContent = state.turno === 'R' ? 'Turno: Rojas' : 'Turno: Negras';

      const msgOblg = state.capturaOblg ? ' (captura obligatoria)' : '';
      mostrarMensaje(msgOblg);
    }

    function mostrarMensaje(txt, esError = false) {
      const el = document.getElementById('msg-estado');
      el.textContent = txt;
      el.style.color = esError ? '#e05555' : '#aaa';
    }

    function mostrarGanador(quien) {
      const banner = document.getElementById('ganador-banner');
      const txtEl  = document.getElementById('ganador-txt');
      txtEl.textContent = quien === 'R' ? '🏆 Ganan las Rojas' : '🏆 Ganan las Negras';
      banner.classList.add('visible');
    }

    /* ════════════════════════════════════════════════════════
       Nueva partida
       ════════════════════════════════════════════════════════ */
    async function nuevaPartida() {
      detenerPolling();
      const banner = document.getElementById('ganador-banner');
      banner.classList.remove('visible');
      state.seleccionada = null;
      state.ultimoTs     = 0;

      const res = await apiNuevaPartida();
      if (!res.ok) { mostrarMensaje('No se pudo crear la partida', true); return; }

      state.partidaId = res.id;
      mostrarMensaje('Partida #' + res.id);
      await sincronizarEstado(true);
      iniciarPolling();
    }

    /* ════════════════════════════════════════════════════════
       Eventos
       ════════════════════════════════════════════════════════ */
    document.getElementById('btn-nueva').addEventListener('click', nuevaPartida);
    document.getElementById('btn-nueva2').addEventListener('click', nuevaPartida);

    // Autoarranque
    nuevaPartida();
  </script>
</body>
</html>
