<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Damas — Rojas vs Negras</title>
  <style>
    *, *::before, *::after { 
        box-sizing: border-box; 
        margin: 0; 
        padding: 0; 
    }
   :root {
      --c-claro: #e6e6e6;
      --c-oscuro: #141414;
      --c-sel: #ffffff;
      --c-mov: #ff3333;
      --c-cap: #ff0000;
      --c-roja: #d90429;
      --c-negra: #0a0a0a;
      --c-dama: #ffffff;
      --c-accent: #ef233c;
      --sombra: 0 10px 30px rgba(0, 0, 0, 0.8);
      --trans: .3s cubic-bezier(.4,0,.2,1);
    }
   body {
        font-family: system-ui, sans-serif;
        /* Fondo con degradado tipo viñeta */
        background: radial-gradient(circle at top, #1a0808 0%, #000000 100%);
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2.5rem 1rem;
        gap: 2rem;
    }
    
    h1 {
        font-size: 1.6rem;
        letter-spacing: .5px;
        color: #ffffff;
    }
    
   #lobby {
        background: rgba(20, 20, 20, 0.65);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-top: 3px solid var(--c-accent);
        border-radius: 16px;
        padding: 2.5rem;
        width: min(420px, 100%);
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9), 0 0 30px rgba(239, 35, 60, 0.15);
        transform: translateY(10px);
    }
    
    #lobby h2 {
        font-size: 1.1rem;
        color: var(--c-claro);
        font-weight: 600;
    }
    
    .campo-grupo {
        display: flex;
        flex-direction: column;
        gap: .4rem;
    }
    
    .campo-grupo label {
        font-size: .8rem;
        color: #ffffff;
        display: flex;
        align-items: center;
        gap: .4rem;
    }
    
   .campo-grupo input {
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        color: #ffffff;
        padding: .85rem 1rem;
        font-size: 1rem;
        outline: none;
        transition: all var(--trans);
        width: 100%;
        box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5);
    }
    
   .campo-grupo input:focus {
        border-color: var(--c-accent);
        background: rgba(0, 0, 0, 0.7);
        box-shadow: 0 0 12px rgba(239, 35, 60, 0.4), inset 0 2px 5px rgba(0, 0, 0, 0.5);
    }
    .campo-grupo input::placeholder {
        color: #888888;
    }
    
    .btn-primario {
        background: linear-gradient(135deg, var(--c-roja), var(--c-accent));
        color: #ffffff;
        border: none;
        padding: .8rem 1.5rem;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all var(--trans);
        box-shadow: 0 4px 15px rgba(239, 35, 60, 0.3);
        width: 100%;
        margin-top: 0.5rem;
    }
    
    .btn-primario:hover {
        background: linear-gradient(135deg, var(--c-accent), #ff3333);
        box-shadow: 0 6px 20px rgba(239, 35, 60, 0.5);
        transform: translateY(-2px);
    }
    
    .btn-primario:active {
        transform: scale(.97);
    }
    
    .btn-primario:disabled {
        opacity: .5;
        cursor: not-allowed;
    }
    
    #panel-enlaces {
        display: none;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(204, 0, 0, 0.5);
        border-radius: 16px;
        padding: 1.5rem;
        width: min(560px, 100%);
        gap: 1rem;
        flex-direction: column;
    }
    
    #panel-enlaces h2 {
        font-size: 1rem;
        color: var(--c-claro);
    }
    
    .enlace-jugador {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: .5rem;
    }
    .enlace-jugador .etiqueta {
        font-size: .78rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: .5px;
    }
    
    .enlace-jugador .etiqueta.R {
        color: var(--c-roja);
    }
    
    .enlace-jugador .etiqueta.N {
        color: #ffffff;
    }
    
    .enlace-url {
        background: rgba(0, 0, 0, 0.8);
        border: 1px solid #333333;
        border-radius: 6px;
        padding: .5rem .75rem;
        font-size: .75rem;
        color: #ffffff;
        word-break: break-all;
        font-family: monospace;
    }
    
    .btn-copiar {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #ffffff;
        border-radius: 6px;
        padding: .35rem .8rem;
        cursor: pointer;
        font-size: .8rem;
        align-self: flex-start;
        transition: background var(--trans);
    }
    
    .btn-copiar:hover {
        background: rgba(255, 255, 255, 0.2);
    }
    
    .btn-row {
        display: flex;
        gap: .75rem;
        flex-wrap: wrap;
    }
    
    #panel {
        display: none;
        gap: 1rem;
        align-items: center;
        background: rgba(255, 255, 255, 0.05);
        padding: .75rem 1.5rem;
        border-radius: 12px;
        border: 1px solid rgba(204, 0, 0, 0.5);
        flex-wrap: wrap;
        justify-content: center;
    }
    .turno-badge {
        display: flex;
        align-items: center;
        gap: .5rem;
        font-size: .9rem;
        font-weight: 500;
    }
    
    .turno-circulo {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid #ffffff;
        transition: background var(--trans);
    }
    
    .turno-circulo.R {
        background: var(--c-roja);
    }
    
    .turno-circulo.N {
        background: var(--c-negra);
    }
    
    .badge-miturno {
        background: #cc0000;
        border: 1px solid #ff0000;
        color: #ffffff;
        padding: .2rem .6rem;
        border-radius: 20px;
        font-size: .75rem;
        font-weight: 600;
    }
    
    .badge-esperar {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #ffffff;
        padding: .2rem .6rem;
        border-radius: 20px;
        font-size: .75rem;
    }
    .badge-yo {
        background: rgba(204, 0, 0, 0.2);
        border: 1px solid var(--c-accent);
        color: var(--c-claro);
        padding: .2rem .7rem;
        border-radius: 20px;
        font-size: .78rem;
        font-weight: 600;
    }
    
    #msg-estado {
        font-size: .85rem;
        color: #ffffff;
    }
    
    #tablero-wrap {
        position: relative;
    }
    
    #tablero {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        grid-template-rows: repeat(8, 1fr);
        width: min(72vw, 560px);
        height: min(72vw, 560px);
        border-radius: 6px;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(239, 35, 60, 0.1);
        border: 2px solid #2a2a2a;
    }
    
    .casilla {
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        position: relative;
        transition: filter var(--trans);
    }
    
    .casilla.claro {
        background: var(--c-claro);
    }
    
    .casilla.oscuro {
        background: var(--c-oscuro);
    }
    
    .casilla.seleccionada {
        filter: brightness(1.3);
        outline: 3px solid var(--c-sel) inset;
    }
    
    .casilla.movimiento::after, .casilla.captura::after {
        content: '';
        position: absolute;
        width: 30%;
        height: 30%;
        border-radius: 50%;
        pointer-events: none;
    }
    
    .casilla.movimiento::after {
        background: var(--c-mov);
        opacity: .8;
        box-shadow: 0 0 10px var(--c-mov); /* Luz neón */
    }
    
    .casilla.captura::after {
        background: var(--c-cap);
        opacity: 1;
        box-shadow: 0 0 15px var(--c-cap); /* Luz neón más fuerte */
    }
    
    #tablero.bloqueado {
        opacity: .8;
        cursor: not-allowed;
    }
    
    #tablero.bloqueado .casilla {
        cursor: not-allowed;
        pointer-events: none;
    }
    
    .pieza {
        width: 78%;
        height: 78%;
        border-radius: 50%;
        position: relative;
        transition: transform var(--trans), box-shadow var(--trans);
        cursor: pointer;
    }
    
    .pieza:hover {
        transform: scale(1.08);
    }
    .pieza.R, .pieza.RD {
        background: radial-gradient(circle at 35% 35%, #ff4d6d, var(--c-roja));
        box-shadow: 0 5px 12px rgba(0, 0, 0, 0.8), inset 0 2px 5px rgba(255, 255, 255, 0.4);
    }
    
    .pieza.N, .pieza.ND {
        background: radial-gradient(circle at 35% 35%, #4a4a4a, var(--c-negra));
        box-shadow: 0 5px 12px rgba(0, 0, 0, 0.9), inset 0 2px 5px rgba(255, 255, 255, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.05);
    }
    
    .pieza.RD::after, .pieza.ND::after {
        content: '♛';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -48%);
        font-size: 1.4em;
        color: var(--c-dama);
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    }
    
    @keyframes pieza-entra {
        from { transform: scale(0); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }
    
    .pieza.nueva {
        animation: pieza-entra .3s cubic-bezier(.175, .885, .32, 1.275);
    }
    
    #ganador-banner {
        display: none;
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        border-radius: 4px;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 1rem;
        z-index: 10;
        border: 2px solid #cc0000;
    }
    
    #ganador-banner.visible {
        display: flex;
    }
    
    #ganador-banner h2 {
        font-size: 2rem;
        color: #ffffff;
        text-shadow: 0 0 10px #ff0000;
    }
    
    #ganador-banner .btn-primario {
        align-self: center;
    }
    
    #leyenda {
        display: flex;
        gap: 1.5rem;
        font-size: .85rem;
        color: #ffffff;
        flex-wrap: wrap;
        justify-content: center;
    }
    
    .leyenda-item {
        display: flex;
        align-items: center;
        gap: .4rem;
    }
    
    .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 1px solid #ffffff;
    }
    .dot.verde {
        background: var(--c-sel);
    }
    
    .dot.azul {
        background: var(--c-mov);
    }
    
    .dot.rojo {
        background: var(--c-cap);
    }
  </style>
</head>
<body>

<h1>♟ Damas <span style="color:#ffffff;font-weight:300">Rojas vs Negras</span></h1>

<div id="lobby">
  <h2>Nueva partida</h2>
  <div class="campo-grupo">
    <label><span style="color:var(--c-roja)">●</span> Nombre Jugador Rojo</label>
    <input id="inp-rojo" type="text" maxlength="30" placeholder="Jugador Rojo" autocomplete="off">
  </div>
  <div class="campo-grupo">
    <label><span style="color:#ffffff">●</span> Nombre Jugador Negro</label>
    <input id="inp-negro" type="text" maxlength="30" placeholder="Jugador Negro" autocomplete="off">
  </div>
  <button class="btn-primario" id="btn-crear">Crear partida →</button>
</div>

<div id="panel-enlaces">
  <h2>✅ Partida creada — comparte cada enlace con su jugador</h2>
  <div class="enlace-jugador">
    <span class="etiqueta R">● Jugador Rojo — <span id="nombre-rojo-lbl"></span></span>
    <div class="enlace-url" id="url-rojo"></div>
    <button class="btn-copiar" onclick="copiarEnlace('url-rojo',this)">Copiar enlace</button>
  </div>
  <div class="enlace-jugador">
    <span class="etiqueta N">● Jugador Negro — <span id="nombre-negro-lbl"></span></span>
    <div class="enlace-url" id="url-negro"></div>
    <button class="btn-copiar" onclick="copiarEnlace('url-negro',this)">Copiar enlace</button>
  </div>
  <div class="btn-row">
    <button class="btn-primario" id="btn-ir-rojo">Jugar como Rojo →</button>
    <button class="btn-primario" id="btn-ir-negro" style="background:#000000; border: 1px solid #ffffff;">Jugar como Negro →</button>
  </div>
</div>

<div id="panel">
  <div class="turno-badge">
    <div class="turno-circulo" id="turno-circulo"></div>
    <span id="turno-txt">Cargando...</span>
  </div>
  <span id="badge-yo"></span>
  <span id="badge-turno"></span>
  <span id="msg-estado"></span>
</div>

<div id="tablero-wrap" style="display:none">
  <div id="tablero"></div>
  <div id="ganador-banner">
    <h2 id="ganador-txt"></h2>
    <button class="btn-primario" id="btn-nueva">Volver al inicio</button>
  </div>
</div>

<div id="leyenda" style="display:none">
  <div class="leyenda-item"><div class="dot verde"></div> Pieza seleccionada</div>
  <div class="leyenda-item"><div class="dot azul"></div> Movimiento libre</div>
  <div class="leyenda-item"><div class="dot rojo"></div> Captura</div>
</div>

<script>
const API = 'api.php';

const state = {
  codigo:null, miToken:null, miJugador:null,
  tablero:null, turno:null, ganador:null,
  movimientos:{}, seleccionada:null,
  ultimoTs:0, pollingTimer:null, capturaOblg:false,
};

/* ── DETECTAR ENLACE CON TOKEN ── */
(function(){
  const p = new URLSearchParams(window.location.search);
  const codigo = p.get('codigo');
  const token  = p.get('token');
  if (codigo && token && codigo.length === 8 && token.length === 64) {
    state.codigo  = codigo.toUpperCase();
    state.miToken = token;
    document.getElementById('lobby').style.display         = 'none';
    document.getElementById('panel-enlaces').style.display = 'none';
    document.getElementById('panel').style.display         = 'flex';
    document.getElementById('tablero-wrap').style.display  = 'block';
    document.getElementById('leyenda').style.display       = 'flex';
    identificarYArrancar();
  }
})();

async function identificarYArrancar() {
  try {
    const r    = await fetch(`${API}?accion=identificar&codigo=${state.codigo}&token=${state.miToken}`);
    const data = await r.json();
    if (data.ok) {
      state.miJugador = data.jugador;
      document.getElementById('badge-yo').innerHTML =
        `<span class="badge-yo">${data.jugador==='R'?'🔴':'⚫'} ${data.apodo}</span>`;
    } else {
      mostrarMensaje('Token inválido — solicita un enlace nuevo', true);
    }
  } catch(e) { mostrarMensaje('Sin conexión', true); }
  sincronizarEstado(true);
  iniciarPolling();
}

/* ── CREAR PARTIDA ── */
document.getElementById('btn-crear').addEventListener('click', async () => {
  const apodoR = document.getElementById('inp-rojo').value.trim()  || 'Jugador Rojo';
  const apodoN = document.getElementById('inp-negro').value.trim() || 'Jugador Negro';
  const btn = document.getElementById('btn-crear');
  btn.disabled = true; btn.textContent = 'Creando...';
  try {
    const res  = await fetch(`${API}?accion=nueva`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({apodo_rojo:apodoR,apodo_negro:apodoN})});
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    const base = window.location.href.split('?')[0];
    const urlR = `${base}?codigo=${data.codigo}&token=${data.token_rojo}`;
    const urlN = `${base}?codigo=${data.codigo}&token=${data.token_negro}`;
    document.getElementById('nombre-rojo-lbl').textContent  = data.apodo_rojo;
    document.getElementById('nombre-negro-lbl').textContent = data.apodo_negro;
    document.getElementById('url-rojo').textContent  = urlR;
    document.getElementById('url-negro').textContent = urlN;
    document.getElementById('lobby').style.display         = 'none';
    document.getElementById('panel-enlaces').style.display = 'flex';
    document.getElementById('btn-ir-rojo').onclick  = () => { window.location.href = urlR; };
    document.getElementById('btn-ir-negro').onclick = () => { window.location.href = urlN; };
  } catch(e) {
    alert('Error: ' + e.message);
    btn.disabled = false; btn.textContent = 'Crear partida →';
  }
});

function copiarEnlace(id, btn) {
  navigator.clipboard.writeText(document.getElementById(id).textContent).then(() => {
    const o = btn.textContent; btn.textContent='✓ Copiado';
    setTimeout(()=>btn.textContent=o, 2000);
  });
}

/* ── POLLING ── */
async function sincronizarEstado(forzar=false) {
  const ts = forzar ? 0 : state.ultimoTs;
  try {
    const r = await fetch(`${API}?accion=estado&codigo=${state.codigo}&ts=${ts}`);
    if (r.status===304) return;
    const data = await r.json();
    if (!data.ok) { mostrarMensaje('Error: '+data.error,true); return; }
    state.tablero=data.tablero; state.turno=data.turno; state.ganador=data.ganador;
    state.ultimoTs=data.ts; state.movimientos=data.movimientos??{}; state.capturaOblg=data.capturaOblg;
    actualizarPanel(); renderBoard();
    if (state.ganador) { mostrarGanador(state.ganador); detenerPolling(); }
  } catch(e) { mostrarMensaje('Sin conexión...', true); }
}

function iniciarPolling() {
  detenerPolling();
  state.pollingTimer = setInterval(()=>{ if(!state.ganador) sincronizarEstado(false); }, 2000);
}
function detenerPolling() {
  if (state.pollingTimer) { clearInterval(state.pollingTimer); state.pollingTimer=null; }
}

/* ── RENDER ── */
function renderBoard() {
  const el = document.getElementById('tablero');
  el.innerHTML = '';
  const esMiTurno = !state.miJugador || state.miJugador===state.turno;
  el.classList.toggle('bloqueado', !esMiTurno);
  const movSet=new Set(), capSet=new Set();
  if (state.seleccionada) {
    const k=`${state.seleccionada.fila},${state.seleccionada.col}`;
    for (const m of (state.movimientos[k]??[])) {
      if (m.captura) capSet.add(`${m.fila},${m.col}`);
      else           movSet.add(`${m.fila},${m.col}`);
    }
  }
  for (let f=0;f<8;f++) for (let c=0;c<8;c++) {
    const cas = document.createElement('div');
    cas.className = 'casilla '+((f+c)%2===0?'claro':'oscuro');
    const k=`${f},${c}`;
    if (state.seleccionada?.fila===f && state.seleccionada?.col===c) cas.classList.add('seleccionada');
    else if (capSet.has(k)) cas.classList.add('captura');
    else if (movSet.has(k)) cas.classList.add('movimiento');
    const p=state.tablero[f][c];
    if (p) { const d=document.createElement('div'); d.className=`pieza ${p} nueva`; cas.appendChild(d); setTimeout(()=>d.classList.remove('nueva'),300); }
    cas.addEventListener('click',()=>handleClick(f,c));
    el.appendChild(cas);
  }
}

/* ── CLICK ── */
async function handleClick(fila, col) {
  if (!state.codigo || state.ganador) return;
  if (state.miJugador && state.miJugador!==state.turno) {
    mostrarMensaje('⏳ Espera tu turno', false); return;
  }
  const k=`${fila},${col}`;
  if (state.seleccionada) {
    const movs=(state.movimientos[`${state.seleccionada.fila},${state.seleccionada.col}`]??[]);
    const dest=movs.find(m=>m.fila===fila&&m.col===col);
    if (dest) { await hacerMovimiento(state.seleccionada.fila,state.seleccionada.col,fila,col); return; }
    if (state.movimientos[k]) { state.seleccionada={fila,col}; renderBoard(); return; }
    state.seleccionada=null; renderBoard(); return;
  }
  if (state.movimientos[k]) { state.seleccionada={fila,col}; renderBoard(); }
}

async function hacerMovimiento(orF,orC,dsF,dsC) {
  mostrarMensaje('Enviando...');
  try {
    const res=await fetch(`${API}?accion=mover`,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({codigo:state.codigo,token:state.miToken,orFila:orF,orCol:orC,dsFila:dsF,dsCol:dsC})});
    const data=await res.json();
    if (!data.ok) { mostrarMensaje(res.status===403?'⚠️ No es tu turno':'❌ '+data.error, true); state.seleccionada=null; return; }
    state.seleccionada=null; await sincronizarEstado(true);
  } catch(e) { mostrarMensaje('Error de red', true); }
}

/* ── UI ── */
function actualizarPanel() {
  document.getElementById('turno-circulo').className='turno-circulo '+state.turno;
  document.getElementById('turno-txt').textContent=state.turno==='R'?'Turno: Rojas':'Turno: Negras';
  const badge=document.getElementById('badge-turno');
  if (state.miJugador) {
    if (state.miJugador===state.turno)
      badge.innerHTML=`<span class="badge-miturno">${state.capturaOblg?'⚡ Tu turno — captura obligatoria':'✅ Es tu turno'}</span>`;
    else
      badge.innerHTML=`<span class="badge-esperar">⏳ Turno del rival</span>`;
  }
  if (!state.capturaOblg) mostrarMensaje('');
}

function mostrarMensaje(txt,esError=false) {
  const el=document.getElementById('msg-estado');
  el.textContent=txt; el.style.color=esError?'#ff0000':'#ffffff';
}

function mostrarGanador(quien) {
